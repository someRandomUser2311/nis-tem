[package]
name = "localpost"
version = "0.1.0"
description = "A fully local API client"
edition = "2021"

[lib]
name = "localpost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "sync", "time", "macros", "net", "rt-multi-thread"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

cookie_store = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "multipart", "gzip", "brotli", "deflate", "zstd", "socks", "stream", "http2", "charset"] }
reqwest_cookie_store = "0.8"
base64 = "0.22"
mime_guess = "2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
hdrhistogram = { version = "7", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
